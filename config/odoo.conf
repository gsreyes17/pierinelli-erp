[options]
; ============================================================
;  Pierinelli - Odoo 19 - configuracion de PRODUCCION (contenedor)
;  Las credenciales de BD se pasan por variables de entorno (entrypoint).
; ============================================================

; Rutas de modulos: core (imagen oficial) + nuestros modulos
addons_path = /usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons

; Filestore (en Render free es efimero; los adjuntos se guardan en la BD)
data_dir = /var/lib/odoo

; Detras de un proxy HTTPS (Render)
proxy_mode = True

; No exponer el gestor de bases de datos en produccion
list_db = False

; Rendimiento — free tier (512MB): modo simple, sin multiproceso
workers = 0
limit_time_cpu = 600
limit_time_real = 1200
limit_request = 4096

; Contrasena maestra (CAMBIAR en produccion)
admin_passwd = CAMBIAR_ESTA_CLAVE_MAESTRA
