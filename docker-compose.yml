# Pierinelli ERP — entorno completo (Odoo 19 + PostgreSQL)
# Uso local o en un VPS:
#   docker compose up -d --build
# El entrypoint crea la BD e instala modulos + demo + idioma automaticamente.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: pierinelli
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
    volumes:
      - odoo-db:/var/lib/postgresql/data
    restart: unless-stopped

  odoo:
    build: .
    depends_on:
      - db
    ports:
      - "8069:8069"
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: odoo
      DB_PASSWORD: odoo
      DB_NAME: pierinelli
      PORT: "8069"
    volumes:
      - odoo-data:/var/lib/odoo
    restart: unless-stopped

volumes:
  odoo-db:
  odoo-data:
